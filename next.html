<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Page - Medical Project</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="top-header">
        <img src="png no.1.png" alt="Logo" class="logo">
        <p class="phone">79037944484</p>
    </div>
    <div class="left-nursing-image">
        <img src="nursing image.jpg" alt="Nursing Image">
    </div>
    <div class="left-middle-image">
        <img src="image .3.jpg" alt="Middle Image">
    </div>
    <div class="content-row" style="justify-content:center;">
        <div class="text-block">
            <div class="header-row">
                <h1>Welcome to Health Care</h1>
            </div>
            <div class="doctor-card">
                <img src="Dr Farhat Anjum.jpeg" alt="Dr. Farhat Anjum" class="doctor-image">
                <div>
                    <p class="doctor-name">Dr. Farhat Anjum</p>
                    <p class="doctor-degree">MBBS</p>
                </div>
            </div>
            <div class="doctor-card">
                <img src="Dr Gulfam Ansari.jpeg" alt="Dr. Gulfam Ansari" class="doctor-image">
                <div>
                    <p class="doctor-name">Dr. Gulfam Ansari</p>
                    <p class="doctor-degree">B Pharma</p>
                </div>
            </div>
            <p class="intro-text">Welcome to our medical portal!</p>
            <div class="appointment-panel">
                <h2>Choose Appointment Day</h2>
                <div class="weekday-picker" id="weekday-picker">
                    <button type="button" class="weekday-btn" data-day="Monday">Mon</button>
                    <button type="button" class="weekday-btn" data-day="Tuesday">Tue</button>
                    <button type="button" class="weekday-btn" data-day="Wednesday">Wed</button>
                    <button type="button" class="weekday-btn" data-day="Thursday">Thu</button>
                    <button type="button" class="weekday-btn" data-day="Friday">Fri</button>
                    <button type="button" class="weekday-btn" data-day="Saturday">Sat</button>
                    <button type="button" class="weekday-btn" data-day="Sunday">Sun</button>
                </div>
                <p class="selected-day-text" id="selected-day-text">Selected day: none</p>
                <button class="confirm-button" id="confirm-day" disabled>Confirm appointment</button>
                <p class="confirmation-message" id="confirmation-message"></p>
            </div>
        </div>
    </div>
    <div class="external-date-panel">
        <span class="external-date-day">4</span>
        <span class="external-date-month">May</span>
        <span class="external-date-year">2026</span>
    </div>
</body>
</html>
